<form (ngSubmit)="onSubmit(enteredTitle, enteredRequest)" #form>
    <app-control label="Title">
        <!-- # is used to create a reference to the input element, which is a temporary local reference variable -->
        <input name="title" id="title" #enteredTitle />
    </app-control>
    <app-control label="Request">
        <textarea name="request" id="request" rows="3" #enteredRequest
            placeholder="Enter your request here"></textarea>
    </app-control>
    <p>
        <button type="submit" app-button label="Submit" icon="⌲" class="button"></button>
    </p>
</form>
